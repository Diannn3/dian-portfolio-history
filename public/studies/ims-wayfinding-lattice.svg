<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="wf_obsidian" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#101214" />
      <stop offset="100%" stop-color="#050607" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#wf_obsidian)" rx="8" />

  <!-- Multi-Level Floor Planes (Isometric Slabs) -->
  <!-- Level 1 (Ground Floor) -->
  <polygon points="120,400 480,450 720,360 360,310" fill="#14171A" stroke="#22262B" stroke-width="1.5" />
  <text x="140" y="420" fill="#666B6E" font-family="'Fragment Mono', monospace" font-size="10">LEVEL 01: LECTURE HALLS</text>

  <!-- Level 2 (Second Floor) -->
  <polygon points="120,270 480,320 720,230 360,180" fill="#181B1E" stroke="#2D343B" stroke-width="1.5" stroke-dasharray="3 3" />
  <text x="140" y="290" fill="#8C9296" font-family="'Fragment Mono', monospace" font-size="10">LEVEL 02: FACULTY & LABS</text>

  <!-- Vertical Stairwell Connector Shaft -->
  <line x1="360" y1="310" x2="360" y2="180" stroke="#8EBBC8" stroke-width="2" stroke-dasharray="2 4" />
  <line x1="480" y1="450" x2="480" y2="320" stroke="#8EBBC8" stroke-width="2" stroke-dasharray="2 4" />

  <!-- A* Wayfinding Node Graph (Level 1) -->
  <circle cx="200" cy="380" r="5" fill="#C8CDD0" />
  <circle cx="300" cy="395" r="5" fill="#8EBBC8" />
  <circle cx="420" cy="410" r="5" fill="#8EBBC8" />
  <circle cx="480" cy="380" r="5" fill="#8EBBC8" />
  <circle cx="600" cy="340" r="5" fill="#4A5560" />

  <!-- Level 1 Edges -->
  <path d="M 200 380 L 300 395 L 420 410 L 480 380" stroke="#8EBBC8" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 480 380 L 600 340" stroke="#2D343B" stroke-width="1.5" />

  <!-- Vertical Stair Transition Vector -->
  <path d="M 480 380 L 480 260" stroke="#F5F5F7" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 2" />
  <circle cx="480" cy="260" r="6" fill="#F5F5F7" />
  <text x="495" y="264" fill="#F5F5F7" font-family="'Fragment Mono', monospace" font-size="10">STAIR_TRANSITION (V_COST=1.4)</text>

  <!-- A* Path on Level 2 -->
  <circle cx="400" cy="230" r="5" fill="#8EBBC8" />
  <circle cx="320" cy="210" r="7" fill="#8EBBC8" />
  <circle cx="320" cy="210" r="14" stroke="#8EBBC8" stroke-width="1.5" stroke-opacity="0.5" />
  <path d="M 480 260 L 400 230 L 320 210" stroke="#8EBBC8" stroke-width="2.5" stroke-linecap="round" />

  <text x="210" y="200" fill="#8EBBC8" font-family="'Fragment Mono', monospace" font-size="11" font-weight="bold">GOAL: RM_204_MATH_LAB</text>

  <!-- Technical Telemetry Box -->
  <rect x="24" y="24" width="270" height="58" fill="#101214" stroke="#22262B" stroke-width="1" rx="4" />
  <text x="36" y="44" fill="#F5F5F7" font-family="'Fragment Mono', monospace" font-size="11" font-weight="bold">SYSTEM STUDY: WAYFINDING LATTICE</text>
  <text x="36" y="62" fill="#8C9296" font-family="'Fragment Mono', monospace" font-size="9.5">TOPOLOGICAL A* DIRECTED NODE GRAPH</text>

  <!-- Bottom Metric Tag -->
  <rect x="526" y="440" width="250" height="36" fill="#101214" stroke="#22262B" stroke-width="1" rx="4" />
  <text x="538" y="462" fill="#8EBBC8" font-family="'Fragment Mono', monospace" font-size="10">HEURISTIC: h(n) = dx + dy + dz * w_v</text>
</svg>
